services:

  coordinator:
    image: citusdata/citus:13.0
    container_name: citus-coordinator
    hostname: coordinator

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citus
      POSTGRES_DB: appdb

    volumes:
      - coordinator_data:/var/lib/postgresql/data

    networks:
      - citus-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 3s
      timeout: 5s
      retries: 30


  worker-1:
    image: citusdata/citus:13.0
    container_name: citus-worker-1
    hostname: worker-1

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citus
      POSTGRES_DB: appdb

    volumes:
      - worker1_data:/var/lib/postgresql/data

    networks:
      - citus-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 3s
      timeout: 5s
      retries: 30


  worker-2:
    image: citusdata/citus:13.0
    container_name: citus-worker-2
    hostname: worker-2

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citus
      POSTGRES_DB: appdb

    volumes:
      - worker2_data:/var/lib/postgresql/data

    networks:
      - citus-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 3s
      timeout: 5s
      retries: 30


  worker-3:
    image: citusdata/citus:13.0
    container_name: citus-worker-3
    hostname: worker-3

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citus
      POSTGRES_DB: appdb

    volumes:
      - worker3_data:/var/lib/postgresql/data

    networks:
      - citus-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 3s
      timeout: 5s
      retries: 30


  citus-init:
    image: citusdata/citus:13.0
    container_name: citus-init

    depends_on:
      coordinator:
        condition: service_healthy

      worker-1:
        condition: service_healthy

      worker-2:
        condition: service_healthy

      worker-3:
        condition: service_healthy

    networks:
      - citus-net

    environment:
      PGPASSWORD: citus

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        set -e

        echo ""
        echo "=========================================="
        echo " INICIANDO CONFIGURAÇÃO DO CITUS"
        echo "=========================================="

        echo "Aguardando Coordinator..."

        until pg_isready \
          -h coordinator \
          -p 5432 \
          -U postgres \
          -d appdb
        do
          sleep 2
        done

        echo "Coordinator OK"

        echo ""
        echo "Criando extensão Citus..."

        psql \
          -h coordinator \
          -p 5432 \
          -U postgres \
          -d appdb \
          -c "CREATE EXTENSION IF NOT EXISTS citus;"

        echo ""
        echo "Adicionando worker-1..."

        psql \
          -h coordinator \
          -p 5432 \
          -U postgres \
          -d appdb \
          -c "SELECT citus_add_node('worker-1', 5432);"

        echo ""
        echo "Adicionando worker-2..."

        psql \
          -h coordinator \
          -p 5432 \
          -U postgres \
          -d appdb \
          -c "SELECT citus_add_node('worker-2', 5432);"

        echo ""
        echo "Adicionando worker-3..."

        psql \
          -h coordinator \
          -p 5432 \
          -U postgres \
          -d appdb \
          -c "SELECT citus_add_node('worker-3', 5432);"

        echo ""
        echo "=========================================="
        echo " WORKERS REGISTRADOS"
        echo "=========================================="

        psql \
          -h coordinator \
          -p 5432 \
          -U postgres \
          -d appdb \
          -c "
            SELECT
              nodeid,
              nodename,
              nodeport,
              isactive
            FROM pg_dist_node
            WHERE groupid = 0
            ORDER BY nodeid;
          "

        echo ""
        echo "=========================================="
        echo " CONFIGURAÇÃO FINAL"
        echo "=========================================="

        psql \
          -h coordinator \
          -p 5432 \
          -U postgres \
          -d appdb \
          -c "
            SELECT
              current_setting('citus.shard_count') AS shard_count,
              current_setting('citus.shard_replication_factor') AS replication_factor;
          "

        echo ""
        echo "=========================================="
        echo " CITUS INIT FINALIZADO"
        echo "=========================================="


volumes:

  coordinator_data:
    name: citus_coordinator_data

  worker1_data:
    name: citus_worker1_data

  worker2_data:
    name: citus_worker2_data

  worker3_data:
    name: citus_worker3_data


networks:

  citus-net:
    name: citus-net
    driver: bridge